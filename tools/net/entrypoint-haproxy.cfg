# BSAHI D5 — public entry point for the source-preserving census relay.
# Runs on a host WITH a public IP (any cheap/free VPS). It does NOT run a node.
#
# Peers connect here; HAProxy prepends the PEER'S REAL SOURCE ADDRESS (PROXY
# protocol v2) and forwards over the tunnel to the Mac's demuxer, which reads it
# and hands the clean stream to bitcoind. This is what preserves identity where a
# plain proxy/Tor would collapse every peer to one address.
global
    log stdout local0
    maxconn 8192

defaults
    mode tcp
    timeout connect 10s
    timeout client  1h
    timeout server  1h

frontend btc_in
    bind *:8333
    default_backend mac_node

backend mac_node
    # 9000 = the ssh -R listener on this host (see tools/net/tunnel-up.sh).
    # send-proxy-v2 injects the real source IP:port ahead of the stream.
    server mac 127.0.0.1:9000 send-proxy-v2
