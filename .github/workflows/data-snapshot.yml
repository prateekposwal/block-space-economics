name: Data Snapshot

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No PAT (2026-08-30): SNAPSHOT_PAT expired/revoked and broke checkout
        # (fatal: could not read Username). GITHUB_TOKEN + the workflow-level
        # `permissions: contents: write` is sufficient — main has NO branch
        # protection (verified: protected:false, rulesets empty), so the old
        # "PAT bypasses branch protection" rationale no longer applies.
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate snapshot
        run: python3 tools/generate_snapshot.py

      - name: Validate snapshot JSON
        # Single canonical data-integrity gate (json.parse + conflict markers).
        # Reused by every data-committing path (pattern-first fix): if one of
        # these paths forgot to validate, the duplicated logic drifted and a
        # stash-pop conflict shipped markers into data/. This step fails closed.
        run: python3 tools/validate_data_json.py

      - name: Site integrity check (validate.js — C1-C4)
        # Fails closed: a regression in the integrity checks must block the
        # snapshot commit/push, not ship silently.
        run: node tools/validate.js

      - name: Commit snapshot data
        run: |
          git config user.name "bsahi-snapshot-bot"
          git config user.email "snapshot@bitcoinsahi.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: public snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Conflict-safe sync: retry the merge, never swallow a failure.
          # A failed rebase previously shipped conflict markers into data/.
          for i in 1 2 3; do
            if git pull --rebase origin main 2>/dev/null; then break; fi
            echo "pull/rebase attempt $i failed — restoring, will retry"
            git rebase --abort 2>/dev/null || git merge --abort 2>/dev/null || true
            git checkout --theirs data/ 2>/dev/null || git checkout HEAD -- data/ 2>/dev/null || true
            sleep 5
          done
          # Fail closed: never push invalid JSON (re-validate after sync) —
          # single canonical gate, same as the pre-commit Validate step.
          python3 tools/validate_data_json.py
          git add data/
          git diff --cached --quiet || git commit -m "chore: public snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
