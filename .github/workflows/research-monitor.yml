name: Daily Research Monitor

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run research monitor
        run: python3 tools/research_monitor.py

      - name: Run UTXO cost model (non-fatal)
        continue-on-error: true
        run: python3 research/utxo_cost_model.py

      - name: Check for significant changes and create alert
        continue-on-error: true
        run: |
          python3 -c "
          import json
          try:
            with open('tools/live_data.json') as f:
              d = json.load(f)
            alerts = d.get('alerts', [])
            fees = d.get('fees', {})
            btc = d.get('btc_price')
            if alerts:
              print('API_ALERT')
              for a in alerts:
                print(f'  {a}')
            if fees.get('fastestFee', 0) > 100:
              print('HIGH_FEE_ALERT: fastestFee > 100 sat/vB')
            if fees.get('fastestFee', 0) < 1 and btc and btc > 80000:
              print('LOW_FEE_HIGH_PRICE_ALERT: fees unusually low for current BTC price')
          except:
            pass
          " > alert_output.txt
          if [ -s alert_output.txt ]; then
            echo "ALERTS FOUND:"
            cat alert_output.txt
          else
            echo "No alerts"
          fi

      # Validate AFTER regeneration: data files written by the monitor must pass
      # the site integrity checks (C1-C4) before they are committed.
      - name: Site integrity check (validate.js — C1-C4)
        run: node tools/validate.js

      # COMMIT FIRST — data must reach main even if the issue step fails.
      - name: Commit updated data
        run: |
          git config user.name "research-bot"
          git config user.email "bot@bitcoinsahi.com"
          git add tools/live_data.json tools/fee_history.json tools/fee_history.csv \
                  tools/fee_forecast.json tools/alerts.json research/*.md
          git diff --cached --quiet || git commit -m "chore: daily research update $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push

      - name: Create GitHub Issue for alerts (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let alerts = '';
            try { alerts = fs.readFileSync('alert_output.txt', 'utf8'); } catch(e) {}
            if (alerts && alerts.trim()) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Research Monitor Alert - ' + new Date().toISOString().slice(0,10),
                body: alerts
              });
            }
